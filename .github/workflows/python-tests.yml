# .github/workflows/python-tests.yml
name: Python Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '*/10 8-18 * * 1-5'
    - cron: '0 3 * * *'
  push:
    branches: [ main, 6-3-main, Try#2test, develop, monitoring ]
  pull_request:
    branches: [ main, 6-3-main, Try#2test, develop ]
  workflow_dispatch:

jobs:
  all-tests-and-monitoring:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: obrail
          POSTGRES_PASSWORD: obrail_test_password
          POSTGRES_DB: obrail_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://obrail:obrail_test_password@localhost:5432/obrail_test_db

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Upgrade pip and build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install dependencies
      run: |
        if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
        if [ -f etl/requirements.txt ]; then pip install -r etl/requirements.txt; fi
        if [ -f requirements-test.txt ]; then
          grep -Ev '^fastapi==' requirements-test.txt > /tmp/requirements-test.filtered.txt
          pip install -r /tmp/requirements-test.filtered.txt
        fi

    - name: "Test: API Endpoints (17 tests)"
      run: pytest tests/test_api_endpoints.py -v --tb=short

    - name: "Test: Data Validation (25 tests)"
      run: pytest tests/test_data_validation.py -v --tb=short

    - name: "Test: ETL Pipeline (19 tests)"
      run: pytest tests/test_etl_pipeline.py -v --tb=short

    - name: "Test: Data Merger (18 tests)"
      run: pytest tests/test_data_merger.py -v --tb=short

    - name: "Test: Security (18 tests)"
      run: pytest tests/test_security.py -v --tb=short

    - name: "Test: Integration with PostgreSQL"
      run: |
        # Verifier que la BDD CI est accessible
        python -c "import os; print('DATABASE_URL =', os.getenv('DATABASE_URL'))"
        pytest tests/test_integration.py -v --tb=short

    - name: Install pytest-cov
      run: pip install pytest-cov

    - name: Coverage Report
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=term

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Start services with docker compose
      run: |
        docker compose up -d
        sleep 60

    - name: Initialize database
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        max=30
        attempt=1
        while [ $attempt -le $max ]; do
          if docker compose exec -T database pg_isready -U obrail -d obrail_db; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Attempt $attempt/$max: PostgreSQL not ready yet, waiting..."
          sleep 2
          attempt=$((attempt + 1))
        done

        if [ $attempt -gt $max ]; then
          echo "ERROR: PostgreSQL did not become ready in time"
          exit 1
        fi

        echo "Waiting for tables to be initialized..."
        sleep 10

    - name: Application Health Checks
      run: |
        max_attempts=30
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          if curl -f http://localhost:8000/health; then
            echo "API is healthy"
            break
          fi
          echo "Attempt $attempt of $max_attempts failed. Retrying..."
          sleep 2
          attempt=$((attempt + 1))
        done
        [ $attempt -le $max_attempts ]

        curl -f http://localhost:9090/-/healthy
        curl -f http://localhost:3000/api/health
        curl -f http://localhost:9187
        curl -f http://localhost:8501
        curl -s http://localhost:8000/metrics | head -20
        curl -s 'http://localhost:9090/api/v1/query?query=up' | jq '.'
        curl -s http://localhost:9187/metrics | grep pg_stat_activity_count

    - name: Set up Node.js for E2E
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install Playwright browser
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run frontend E2E tests (Playwright)
      working-directory: ./frontend
      env:
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:8501
      run: npm run e2e

    - name: API Performance Testing
      run: |
        sudo apt-get update && sudo apt-get install -y apache2-utils
        ab -n 100 -c 10 http://localhost:8000/trains/ || true
        ab -n 100 -c 10 http://localhost:8000/stations/ || true
        ab -n 100 -c 10 http://localhost:8000/operators/ || true
        ab -n 100 -c 10 http://localhost:8000/schedules/ || true

        metrics=$(curl -s http://localhost:8000/metrics)
        echo "$metrics" | grep -q "http_requests_total"

    - name: Monitoring Stack Validation
      run: |
        docker run --rm --entrypoint promtool \
          -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml \
          -v $(pwd)/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml \
          prom/prometheus:latest check config /etc/prometheus/prometheus.yml
        for dashboard in grafana/provisioning/dashboards/*.json; do
          if [ -f "$dashboard" ]; then
            python3 -m json.tool "$dashboard" > /dev/null
            echo "OK $dashboard"
          fi
        done
        docker compose config --quiet

    - name: Upload health check report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: health-check-report
        path: ./logs/

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ./frontend/playwright-report/

    - name: Cleanup
      if: always()
      run: docker compose down -v