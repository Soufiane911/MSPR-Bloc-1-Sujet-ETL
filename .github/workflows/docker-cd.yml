# Build and push application Docker images to GHCR (Phase 1 CD).
# Runs in parallel with python-tests.yml on branch 6-3-main.
name: Docker CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

on:
  push:
    branches: [6-3-main, main-6.2-6.4]
  pull_request:
    branches: [6-3-main, main-6.2-6.4]
  workflow_dispatch:

concurrency:
  group: docker-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - component: api
            context: api
            dockerfile: api/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: etl
            context: etl
            dockerfile: etl/Dockerfile
          - component: dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR login can time out on busy runners (seen on matrix job "etl").
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "GHCR login attempt ${attempt}/5..."
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin; then
              echo "GHCR login successful."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "GHCR login failed, retrying in 20s..."
              sleep 20
            fi
          done
          echo "GHCR login failed after 5 attempts."
          exit 1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/6-3-main' && github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
